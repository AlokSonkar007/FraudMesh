services:
  - type: web
    name: fraudmesh-demo
    runtime: python
    plan: free
    branch: fraudmesh-white-theme-5bc57
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
